<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Fira+Code:wght@300..700&family=Geist+Mono:wght@100..900&family=Geist:wght@100..900&family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&family=IBM+Plex+Sans:ital,wght@0,100..700;1,100..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Lora:ital,wght@0,400..700;1,400..700&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Outfit:wght@100..900&family=Oxanium:wght@200..800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=Roboto:ital,wght@0,100..900;1,100..900&family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&family=Space+Grotesk:wght@300..700&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <title>FinControl - Controle Financeiro Pessoal</title>
    <meta name="description" content="Controle suas financas pessoais, dividas, cartoes de credito e assinaturas em um unico lugar." />
  </head>
  <body>
    <div id="root">
      <style>
        .boot-loading{position:fixed;inset:0;display:grid;place-items:center;background:#f6f6f8;color:#18181b;font:15px "Segoe UI",system-ui,sans-serif;text-align:center;padding:24px}
        .boot-loading strong{display:block;font-size:26px;margin:20px 0 12px}.boot-loading p{color:#656570;margin:8px 0}.boot-spinner{display:inline-block;width:32px;height:32px;border:3px solid #1173d426;border-top-color:#1173d4;border-radius:50%;animation:boot-spin 1s linear infinite}
        @keyframes boot-spin{to{transform:rotate(360deg)}}
        @media(prefers-color-scheme:dark){.boot-loading{background:#0c0b10;color:#f4f4f5}.boot-loading p{color:#aaaab4}}
        @media(prefers-reduced-motion:reduce){.boot-spinner{animation:none}}
      </style>
      <div class="boot-loading" role="status" aria-live="polite"><div><span class="boot-spinner" aria-hidden="true"></span><strong>FinControl</strong><p>Preparando suas finanças...</p><p>Aguarde enquanto carregamos o sistema.</p></div></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
